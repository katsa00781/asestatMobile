<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { abbr: 'FAL', name: 'Falco-Vulcano Szombathely', p: 18, w: 15, l: 3, diff: 142, pts: 33 },
      { abbr: 'SZO', name: 'Szolnoki Olajbányász', p: 18, w: 14, l: 4, diff: 98, pts: 32 },
      { abbr: 'ASE', name: 'ASE', p: 18, w: 12, l: 6, diff: 64, pts: 30, ase: true },
      { abbr: 'ALB', name: 'Alba Fehérvár', p: 18, w: 11, l: 7, diff: 41, pts: 29 },
      { abbr: 'KOR', name: 'Egis Körmend', p: 18, w: 10, l: 8, diff: 12, pts: 28 },
      { abbr: 'SOP', name: 'Sopron KC', p: 18, w: 9, l: 9, diff: -4, pts: 27 },
      { abbr: 'KAP', name: 'Kaposvári KK', p: 18, w: 8, l: 10, diff: -22, pts: 26 },
      { abbr: 'DEA', name: 'DEAC', p: 18, w: 7, l: 11, diff: -48, pts: 25 },
      { abbr: 'ZTE', name: 'Zalakerámia ZTE', p: 18, w: 5, l: 13, diff: -87, pts: 23 },
      { abbr: 'PVS', name: 'PVSK', p: 18, w: 3, l: 15, diff: -136, pts: 21 }
    ];

    const rows = raw.map((t, i) => {
      const rank = i + 1;
      const isAse = !!t.ase;
      const topThree = rank <= 3;
      return {
        rank,
        isAse,
        abbr: t.abbr,
        name: t.name,
        played: t.p,
        wins: t.w,
        losses: t.l,
        diffLabel: t.diff > 0 ? `+${t.diff}` : `${t.diff}`,
        diffColor: t.diff > 0 ? '#10D98A' : (t.diff < 0 ? '#FF4757' : '#7A9ABB'),
        points: t.pts,
        rankColor: isAse ? '#00D4FF' : (topThree ? '#00D4FF' : '#4A6D95'),
        nameColor: isAse ? '#00D4FF' : '#E8F4FF',
        rowBg: isAse ? '#0F1F3D' : 'transparent',
        divider: i === raw.length - 1 ? 'none' : '1px solid #101E33',
        badgeBorder: isAse ? '1px solid #00D4FF' : '1px solid #1E3A5F',
        badgeGlow: isAse ? '0 0 10px rgba(0,212,255,0.35)' : 'none',
        badgeTextColor: isAse ? '#00D4FF' : '#E8F4FF'
      };
    });

    return { rows };
  }
}
