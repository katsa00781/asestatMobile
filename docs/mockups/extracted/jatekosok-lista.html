<!DOCTYPE html>
<html><head>

</head>
<body>
<x-dc>
<!-- helmet (Google Fonts) kihagyva -->
<div style="display:flex;justify-content:center;padding:40px 20px;background:#0a0a0a;min-height:100vh;box-sizing:border-box">
<x-import component-from-global-scope="IOSDevice" from="9ef0941f-5635-475f-a693-22e7eadcbd2b#/ios-frame.jsx" width="{{ 390 }}" height="{{ 844 }}" dark="{{ true }}" hint-size="390px,844px">
  <div style="width:390px;height:844px;position:relative;overflow:hidden;background:#050B14;background-image:radial-gradient(circle at 1px 1px, rgba(0,212,255,0.045) 1px, transparent 0);background-size:24px 24px;font-family:'DM Sans',sans-serif;color:#E8F4FF;box-sizing:border-box">

    <div style="position:absolute;top:0;left:0;right:0;bottom:83px;overflow-y:auto" class="ase-scroll">

      <div style="padding-top:54px"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;box-sizing:border-box">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px">ASE</div>
        <div style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:#0F1F3D;border:1px solid #1E3A5F;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#E8F4FF;white-space:nowrap;flex-shrink:0">
          <span>2025/2026 · ASE</span><span style="color:#7A9ABB;font-size:10px">▾</span>
        </div>
        <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.6">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M22 12h-3M5 12H2M19.07 4.93l-2.12 2.12M7.05 16.95l-2.12 2.12M19.07 19.07l-2.12-2.12M7.05 7.05L4.93 4.93"></path>
        </svg>
      </div>

      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 16px 16px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:28px">JÁTÉKOSOK</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:15px;color:#4A6D95">14 fő</div>
      </div>

      <div style="margin:0 16px 16px;position:relative">
        <div style="position:absolute;left:14px;top:0;bottom:0;display:flex;align-items:center">
          <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.8">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>
          </svg>
        </div>
        <input value="{{ query }}" sc-camel-on-change="{{ onQueryChange }}" placeholder="Játékos keresése" style="width:100%;height:44px;background:#0A1628;border:1px solid #1E3A5F;border-radius:4px;box-sizing:border-box;padding:0 14px 0 40px;font-family:'DM Sans',sans-serif;font-size:14px;color:#E8F4FF;outline:none">
      </div>

      <div style="display:flex;gap:12px;overflow-x:auto;padding:0 16px 20px;box-sizing:border-box" class="ase-scroll">
        <sc-for list="{{ sortChips }}" as="chip" hint-placeholder-count="5">
          <div sc-camel-on-click="{{ chip.select }}" style="flex-shrink:0;display:flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:6px;box-sizing:border-box;background:{{ chip.bg }};border:1px solid {{ chip.border }};font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:{{ chip.color }};cursor:pointer;white-space:nowrap">
            <span>{{ chip.label }}</span>
            <sc-if value="{{ chip.active }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:9px">▾</span>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="padding:0 16px 24px">
        <sc-for list="{{ players }}" as="p" hint-placeholder-count="8">
          <div>
            <sc-if value="{{ p.isFirst }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;padding:0 16px 6px;box-sizing:border-box">
                <div style="width:32px;flex-shrink:0"></div>
                <div style="flex:1"></div>
                <div style="display:flex;gap:16px">
                  <span style="width:48px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#4A6D95">PPG</span>
                  <span style="width:48px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#4A6D95">RPG</span>
                  <span style="width:48px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#4A6D95">APG</span>
                </div>
              </div>
            </sc-if>
            <div style="position:relative;display:flex;align-items:center;height:68px;padding:0 16px;box-sizing:border-box;background:{{ p.rowBg }};border-radius:10px;margin-bottom:8px">
              <sc-if value="{{ p.pressed }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;left:0;top:0;bottom:0;width:2px;background:#00D4FF;border-radius:10px 0 0 10px"></div>
              </sc-if>
              <div style="width:32px;height:32px;border-radius:50%;background:#162440;border:1px solid #2A4468;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;color:#E8F4FF">{{ p.number }}</span>
              </div>
              <div style="flex:1;min-width:0;padding:0 12px">
                <div style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;color:#E8F4FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
                <div style="font-family:'DM Sans',sans-serif;font-size:13px;color:#7A9ABB;margin-top:2px">{{ p.position }}</div>
              </div>
              <div style="display:flex;gap:16px;flex-shrink:0">
                <span style="width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:20px;color:#E8F4FF">{{ p.ppg }}</span>
                <span style="width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:20px;color:#E8F4FF">{{ p.rpg }}</span>
                <span style="width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:20px;color:#E8F4FF">{{ p.apg }}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>

    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:83px;background:#0A1628;border-top:1px solid #1E3A5F;display:flex;box-sizing:border-box;padding-bottom:20px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.6">
          <path d="M4 11.5 12 4l8 7.5"></path>
          <path d="M6 10v9h12v-9"></path>
        </svg>
        <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#4A6D95">Ma</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative">
        <div style="position:absolute;top:0;width:24px;height:3px;border-radius:2px;background:#00D4FF"></div>
        <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="1.6">
          <circle cx="12" cy="8" r="3.2"></circle>
          <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path>
        </svg>
        <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#00D4FF">Játékosok</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.6">
          <rect x="4" y="5" width="16" height="15" rx="2"></rect>
          <path d="M4 10h16M8 3v4M16 3v4"></path>
        </svg>
        <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#4A6D95">Meccsek</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.6">
          <rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect>
          <path d="M3.5 9.5h17M3.5 14.5h17M9.5 4.5v15"></path>
        </svg>
        <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#4A6D95">Tabella</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4A6D95" stroke-width="1.6">
          <path d="M12 3l1.8 5.6L19 10l-5.2 1.4L12 17l-1.8-5.6L5 10l5.2-1.4z"></path>
        </svg>
        <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#4A6D95">Elemzés</span>
      </div>
    </div>

  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { query: '', sort: 'PONT' };

  renderVals() {
    const raw = [
      { number: 12, name: 'Kovács Péter', position: 'Bedobó hátvéd', ppg: 18.4, rpg: 4.2, apg: 3.1, min: 32.4, eff: 22.1 },
      { number: 7, name: 'Nagy Bence', position: 'Irányító', ppg: 12.1, rpg: 2.8, apg: 6.4, min: 30.1, eff: 17.8 },
      { number: 23, name: 'Szabó Márton', position: 'Bedobó szélső', ppg: 14.7, rpg: 5.9, apg: 2.2, min: 29.6, eff: 18.5 },
      { number: 9, name: 'Tóth Ádám', position: 'Center', ppg: 9.8, rpg: 8.4, apg: 1.1, min: 24.8, eff: 15.9 },
      { number: 15, name: 'Varga Dániel', position: 'Erőcsatár', ppg: 11.2, rpg: 6.7, apg: 1.8, min: 26.3, eff: 16.4 },
      { number: 4, name: 'Horváth Levente', position: 'Irányító', ppg: 7.4, rpg: 1.9, apg: 4.2, min: 22.7, eff: 11.2 },
      { number: 33, name: 'Balogh Gergő', position: 'Center', ppg: 8.1, rpg: 7.2, apg: 0.9, min: 21.5, eff: 13.6 },
      { number: 21, name: 'Molnár Zsolt', position: 'Bedobó szélső', ppg: 6.3, rpg: 2.4, apg: 1.5, min: 18.2, eff: 9.4 }
    ];

    const sortKeyMap = { PONT: 'ppg', LEPATTANÓ: 'rpg', ASSZISZT: 'apg', PERC: 'min', HATÉKONYSÁG: 'eff' };
    const key = sortKeyMap[this.state.sort];
    const q = this.state.query.trim().toLowerCase();

    const filtered = raw.filter(p => p.name.toLowerCase().includes(q));
    const sorted = [...filtered].sort((a, b) => b[key] - a[key]);

    const players = sorted.map((p, i) => ({
      ...p,
      isFirst: i === 0,
      pressed: p.name === 'Kovács Péter',
      rowBg: p.name === 'Kovács Péter' ? '#0F1F3D' : '#0A1628',
      ppg: p.ppg.toFixed(1),
      rpg: p.rpg.toFixed(1),
      apg: p.apg.toFixed(1)
    }));

    const chipLabels = ['PONT', 'LEPATTANÓ', 'ASSZISZT', 'PERC', 'HATÉKONYSÁG'];
    const sortChips = chipLabels.map(label => {
      const active = label === this.state.sort;
      return {
        label,
        active,
        bg: active ? 'rgba(0,212,255,0.14)' : '#0F1F3D',
        border: active ? 'rgba(0,212,255,0.3)' : 'transparent',
        color: active ? '#00D4FF' : '#7A9ABB',
        select: () => this.setState({ sort: label })
      };
    });

    return {
      query: this.state.query,
      onQueryChange: e => this.setState({ query: e.target.value }),
      players,
      sortChips
    };
  }
}

</script>


</body></html>
